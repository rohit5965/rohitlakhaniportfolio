
name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Check JavaScript
        run: node --check dist/script.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publish portfolio
        id: deployment
        uses: actions/deploy-pages@v4
        
      
      - name: Enforce HTTPS
        env:
          GH_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PAGES_ADMIN_TOKEN is missing"
            exit 1
          fi

          echo "Checking GitHub Pages HTTPS certificate..."

          if gh api \
            --method PUT \
            "repos/${GH_REPO}/pages" \
            -F https_enforced=true; then

            echo "HTTPS enforcement enabled successfully."

          else
            echo "::warning::HTTPS could not be enforced yet."
            echo "Check certificate provisioning and DNS settings."
            echo "Deployment itself remains successful."
          fi
